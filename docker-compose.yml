version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: canela_bank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: canela_bank_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_canela_data:/var/lib/postgresql/data

volumes:
  postgres_canela_data:
